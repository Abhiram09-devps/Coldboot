<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COLDBOOT — ACCESS CONTROL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E0C; --bg-panel:#0F1510;
    --line:#233524; --phosphor:#4EE58A; --phosphor-dim:#2B8F55; --phosphor-faint:#1B3324;
    --text:#D9E4D3; --text-dim:#7C8C77; --error:#FF5C5C;
    --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--mono);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  body::before{
    content:''; position:fixed; inset:0;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 3px);
    pointer-events:none; opacity:0.35;
  }
  .login-wrap{ max-width:420px; width:100%; padding:20px; }
  .bios{ border:1px solid var(--phosphor-faint); background:var(--bg-panel); padding:28px 26px; }
  .bios-top{ font-size:11px; color:var(--phosphor-dim); letter-spacing:0.1em; margin-bottom:18px; border-bottom:1px solid var(--line); padding-bottom:14px; }
  .bios-top .r2{ color:var(--text-dim); margin-top:4px; display:block; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:10px; color:var(--text-dim); letter-spacing:0.12em; margin-bottom:6px; }
  .field input{
    width:100%; background:var(--bg); border:1px solid var(--line);
    color:var(--phosphor); font-family:var(--mono); font-size:14px; padding:12px; letter-spacing:0.03em;
  }
  .field input:focus{ border-color:var(--phosphor-dim); outline:none; }
  .btn{
    width:100%; font-size:13px; letter-spacing:0.08em; padding:14px 22px;
    border:1px solid var(--phosphor); background:var(--phosphor); color:var(--bg);
    font-weight:700; text-transform:uppercase; cursor:pointer; font-family:var(--mono);
  }
  .btn:hover{ background:#63f39c; }
  .console{ margin-top:16px; font-size:11px; min-height:20px; white-space:pre-line; line-height:1.7; }
  .console.error{ color:var(--error); }
  .logo{ font-weight:700; font-size:16px; letter-spacing:0.05em; color:var(--phosphor); margin-bottom:4px; }
  .logo span{ color:var(--text-dim); }
  .dl-link{
    display:block; margin-top:14px; text-align:center; font-size:11px;
    letter-spacing:0.08em; color:var(--text-dim); text-decoration:none;
    border:1px solid var(--line); padding:10px; text-transform:uppercase;
  }
  .dl-link:hover{ color:var(--phosphor); border-color:var(--phosphor-dim); }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="logo">C:\&gt;_ <span>COLDBOOT</span></div>
  <div class="bios">
    <div class="bios-top">
      COLDBOOT ACCESS CONTROL v4.2
      <span class="r2">ENTER CREDENTIALS TO CONTINUE</span>
    </div>
    <form method="POST" action="{{ url_for('login') }}">
      <div class="field">
        <label>USERNAME</label>
        <input type="text" name="username" placeholder="player_01" autocomplete="off" autofocus>
      </div>
      <div class="field">
        <label>PASSWORD</label>
        <input type="password" name="password" placeholder="••••••••">
      </div>
      <button class="btn" type="submit">AUTHENTICATE</button>
    </form>
    {% if error %}
      <div class="console error">{{ error }}</div>
    {% endif %}
    <a class="dl-link" href="{{ url_for('static', filename='gg/bb/hh/wordlist.txt') }}" download>
      ⬇ download recon wordlist
    </a>
  </div>
</div>

<!--
  TODO(ops): remove this debug leftover before launch.
  last night's automated backup job used xor seed prefix 'c0ld' -- the
  nightly rotation suffix gets stamped in the response headers, check those too.
-->
</body>
</html>
